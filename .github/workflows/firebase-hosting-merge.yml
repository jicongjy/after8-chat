# main에 올라오면 화면(Hosting)을 자동으로 배포한다.
# 함수(functions)와 보안 규칙(firestore.rules)은 자동 배포되지 않는다. 바꿨을 때는 컴퓨터에서 npm run deploy 를 실행한다.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  workflow_dispatch: # 깃허브 Actions 화면의 "Run workflow" 버튼으로 직접 실행할 수 있게 한다

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # web/firebase-config.js 는 깃에 올리지 않는 파일이다. Firebase Hosting 이 공개로 제공하는 설정 주소에서 받아 만든다.
      # (손으로 붙여 넣은 비밀값은 예시 글자가 섞여 서비스가 깨진 적이 있어서 쓰지 않는다)
      - name: 화면 설정 파일 만들기
        run: |
          curl -fsS --retry 3 https://selectmarket-chat-8pm-c09df.web.app/__/firebase/init.json -o /tmp/init.json
          printf 'window.SMC_FIREBASE_CONFIG = %s;\n' "$(cat /tmp/init.json)" > web/firebase-config.js
          # 값이 진짜인지 확인한다: 프로젝트가 맞고, 예시 글자(...)가 없고, 키 모양이 맞아야 한다.
          grep -q '"projectId": "selectmarket-chat-8pm"' web/firebase-config.js || { echo "::error::설정의 프로젝트 ID가 selectmarket-chat-8pm 이 아니에요."; exit 1; }
          grep -q '\.\.\.' web/firebase-config.js && { echo "::error::설정에 예시 글자(...)가 들어 있어요."; exit 1; }
          grep -Eq '"apiKey": "AIza[0-9A-Za-z_-]{30,}"' web/firebase-config.js || { echo "::error::apiKey 모양이 올바르지 않아요."; exit 1; }
          node -e "new Function(require('fs').readFileSync('web/firebase-config.js','utf8'))" || { echo "::error::설정 파일 문법이 올바르지 않아요."; exit 1; }

      - run: npm ci && npm run build:web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SELECTMARKET_CHAT_8PM }}
          channelId: live
          projectId: selectmarket-chat-8pm
